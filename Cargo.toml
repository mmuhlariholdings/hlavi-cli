[package]
name = "hlavi-cli"
version = "0.4.0"
edition = "2021"
authors = ["M Muhlari Holdings (Pty) Ltd"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmuhlariholdings/hlavi-cli"
homepage = "https://hlavi.mmuhlariholdings.co.za"
description = "Command-line interface for Hlavi kanban task management"
rust-version = "1.75"

[[bin]]
name = "hlavi"
path = "src/main.rs"

[dependencies]
hlavi-core = { git = "https://github.com/mmuhlariholdings/hlavi-core", tag = "v0.7.0" }

# CLI framework
clap = { version = "4.4", features = ["derive", "cargo"] }

# Terminal UI
colored = "2.1"
dialoguer = "0.11"
tabled = "0.15"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Date and time
chrono = "0.4"

# Error handling
anyhow = "1.0"

# Configuration
directories = "5.0"

[dev-dependencies]
tempfile = "3.8"

