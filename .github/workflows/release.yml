name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g., v0.1.4)'
        required: true
        type: string
      create_draft_release:
        description: 'Create draft release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Release from Tag
    uses: mmuhlariholdings/hlavi-workflows/.github/workflows/rust-release-from-tag.yml@main
    with:
      tag: ${{ github.event.inputs.tag }}
      binary-name: 'hlavi'
      create-draft-release: ${{ github.event.inputs.create_draft_release == 'true' }}
    secrets:
      github-token: ${{ secrets.HLAVI_RELEASE_PAT }}

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.create_draft_release != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Homebrew tap (placeholder)
        run: echo "Homebrew formula update would go here"
        # TODO: Implement homebrew tap update when ready
